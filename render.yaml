services:
  - type: web
    name: warden
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: WARDEN_PUBLIC_URL
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: WARDEN_LLM_DAILY_CAP
        value: "700"
      # JSON with the sandbox invoice and dispute ids, e.g. {"invoices": {...}, "disputes": {...}}
      - key: WARDEN_SANDBOX_SEED
        sync: false
      - key: WARDEN_SIGNING_KEY
        generateValue: true
      - key: WARDEN_NTFY_TOPIC
        sync: false
